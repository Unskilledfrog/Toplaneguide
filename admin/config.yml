backend:
  name: git-gateway
  branch: main

site_url: https://lolgameguide.netlify.app
display_url: https://lolgameguide.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Homepage, navigation and images"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Homepage title"
            name: "title"
            widget: "string"
          - label: "Description"
            name: "description"
            widget: "text"
          - label: "Navigation links"
            name: "navigation"
            widget: "list"
            fields:
              - label: "Link text"
                name: "label"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
          - label: "Images"
            name: "images"
            widget: "list"
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Alt text"
                name: "alt"
                widget: "string"
                required: false

  - name: "champions"
    label: "Champions and champion guides"
    files:
      - name: "champion_data"
        label: "Champion roster and guides"
        file: "content/champions.json"
        format: "json"
        fields:
          - label: "Champions"
            name: "champions"
            widget: "list"
            summary: "{{fields.name}} — {{fields.lane}}"
            fields:
              - { label: "Champion name (must match in-game name)", name: "name", widget: "string" }
              - label: "Lane"
                name: "lane"
                widget: "select"
                options: [ { label: "Top", value: "top" }, { label: "Jungle", value: "jungle" }, { label: "Mid", value: "mid" }, { label: "Bot / ADC", value: "adc" }, { label: "Support", value: "support" } ]
                default: "top"
              - label: "Champion class"
                name: "champion_class"
                widget: "select"
                options: [ { label: "Tank", value: "tank" }, { label: "Fighter", value: "fighter" }, { label: "Ranged", value: "ranged" }, { label: "Mage", value: "mage" }, { label: "Assassin", value: "assassin" } ]
                default: "fighter"
              - { label: "Deals mostly magic damage", name: "magic_damage", widget: "boolean", default: false, required: false }
              - { label: "Tank killer strength (0–5)", name: "tank_killer", widget: "number", value_type: "int", min: 0, max: 5, default: 0, required: false }
              - { label: "Strong early game", name: "strong_early", widget: "boolean", default: false, required: false }
              - { label: "Scales into late game", name: "scales_late", widget: "boolean", default: false, required: false }
              - { label: "Pokes from range", name: "ranged_poke", widget: "boolean", default: false, required: false }
              - { label: "Melee without gap closer", name: "no_gapcloser", widget: "boolean", default: false, required: false }
              - { label: "Has gap closer / dive", name: "gapcloser", widget: "boolean", default: false, required: false }
              - { label: "Hide champion", name: "hidden", widget: "boolean", default: false, required: false }
              - { label: "Early game guide", name: "early_game", widget: "text", required: false }
              - { label: "Mid game guide", name: "mid_game", widget: "text", required: false }
              - { label: "Late game guide", name: "late_game", widget: "text", required: false }
              - { label: "Runes", name: "runes", widget: "text", required: false }
              - { label: "Starting item", name: "starting_item", widget: "string", required: false }
              - { label: "Core items", name: "core_items", widget: "text", required: false }
              - { label: "Summoner spells", name: "summoners", widget: "string", required: false }

  - name: "matchups"
    label: "Champion matchups"
    files:
      - name: "matchup_overrides"
        label: "Matchup ratings and guides"
        file: "content/matchups.json"
        format: "json"
        fields:
          - label: "Manual matchup overrides"
            name: "matchups"
            widget: "list"
            summary: "{{fields.champion}} vs {{fields.opponent}} ({{fields.lane}})"
            fields:
              - label: "Lane"
                name: "lane"
                widget: "select"
                options:
                  - { label: "Top lane", value: "top" }
              - label: "Your champion"
                name: "champion"
                widget: "string"
              - label: "Opponent champion"
                name: "opponent"
                widget: "string"
              - label: "Difficulty rating (1 = easiest, 10 = hardest)"
                name: "rating"
                widget: "number"
                value_type: "int"
                min: 1
                max: 10
              - label: "Why this rating"
                name: "why"
                widget: "text"
                required: false
              - label: "Game plan"
                name: "plan"
                widget: "text"
                required: false
              - label: "Runes"
                name: "runes"
                widget: "text"
                required: false
              - label: "Starting item"
                name: "starting_item"
                widget: "string"
                required: false
              - label: "First recall / first back"
                name: "first_back"
                widget: "string"
                required: false
              - label: "Summoner spells"
                name: "summoners"
                widget: "string"
                required: false
